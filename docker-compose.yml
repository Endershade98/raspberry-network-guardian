version: "3.9"

services:

  tests:
    build:
      context: .
      dockerfile: Dockerfile.dev
    privileged: true
    network_mode: host
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "
      cmake -S . -B build -G Ninja &&
      cmake --build build &&
      cd build &&
      ctest --output-on-failure
      "

  guardian:
    build:
      context: .
      dockerfile: Dockerfile.dev
    privileged: true
    network_mode: host
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "
      cmake -S . -B build -G Ninja &&
      cmake --build build &&
      ./build/network_guardian
      "

  redis:
    image: redis:7
    ports:
      - "6379:6379"